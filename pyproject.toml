[project]
name = "fastapi-json-to-xlsx"
version = "0.3.0"
description = "Convert JSON into formatted Excel workbooks or CSV files, with a web UI and API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.16.0",
    "fastapi[standard]>=0.162.0",
    "xlsxwriter>=3.3.1",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
